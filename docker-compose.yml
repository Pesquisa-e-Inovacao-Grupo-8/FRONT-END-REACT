version: '3.8'
services:
  frontend:
    build: .
    image: front-end-react:local
    container_name: front-end-react
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_ENV=${VITE_ENV}
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    # volumes: # uncomment for local dev tweaks
    #   - ./public/env-config.js:/usr/share/nginx/html/env-config.js
